# Reference logic plugin for eve-online-tooling (issue #494).
# Build the .wasm with:
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown \
#     --manifest-path examples/plugins/pricing-model/Cargo.toml
#   cp examples/plugins/pricing-model/target/wasm32-unknown-unknown/release/pricing_model.wasm \
#      examples/plugins/pricing-model/pricing_model.wasm
# Then drop the whole `pricing-model/` folder into `<app_data_dir>/plugins/`.
[package]
name = "pricing-model"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
