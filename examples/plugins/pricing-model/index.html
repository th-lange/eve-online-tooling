<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pricing Model</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #e4e4e7;
        background: #18181b;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p {
        color: #a1a1aa;
        margin: 0 0 1rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input,
      button {
        font: inherit;
        border-radius: 0.375rem;
        border: 1px solid #3f3f46;
        background: #09090b;
        color: #e4e4e7;
        padding: 0.4rem 0.6rem;
      }
      button {
        background: #4f46e5;
        border-color: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
      #out {
        min-height: 1.5rem;
        color: #34d399;
      }
      code {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <h1>Cargo efficiency</h1>
    <p>
      Enter an item <code>typeID</code>; the plugin's own WASM scores it through
      the host bridge (needs the <code>sde:read</code> capability).
    </p>
    <form id="eval">
      <input id="typeId" type="number" value="34" min="1" />
      <button type="submit">Evaluate</button>
    </form>
    <div id="out"></div>
    <script type="module" src="./ui/main.js"></script>
  </body>
</html>
