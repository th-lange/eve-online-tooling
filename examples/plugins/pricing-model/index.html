<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pricing Model</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #e4e4e7;
        background: #18181b;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p {
        color: #a1a1aa;
        margin: 0 0 1rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input,
      button {
        font: inherit;
        border-radius: 0.375rem;
        border: 1px solid #3f3f46;
        background: #09090b;
        color: #e4e4e7;
        padding: 0.4rem 0.6rem;
      }
      button {
        background: #4f46e5;
        border-color: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
      #out {
        min-height: 1.5rem;
        color: #34d399;
      }
      code {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <h1>Cargo efficiency</h1>
    <p>
      Enter an item <code>typeID</code>; the plugin's own WASM scores it through
      the host bridge (needs the <code>sde:read</code> capability).
    </p>
    <form id="eval">
      <input id="typeId" type="number" value="34" min="1" />
      <button type="submit">Evaluate</button>
    </form>
    <div id="out"></div>

    <!--
      The invoke bridge, inlined so this UI is a single self-contained file.
      A sandboxed iframe has an opaque origin, so it can only *import* a separate
      module when the host sends CORS on plugin:// — inlining avoids that
      entirely and works on any build. For a multi-file / TypeScript UI, use
      plugin-ui-sdk.js instead (see docs/plugins.md).
    -->
    <script>
      const CHANNEL = "eve-plugin";
      let nextId = 1;
      const pending = new Map();

      window.addEventListener("message", (event) => {
        const m = event.data;
        if (!m || m.channel !== CHANNEL || m.kind !== "result") return;
        const entry = pending.get(m.id);
        if (!entry) return;
        pending.delete(m.id);
        if (m.ok) entry.resolve(m.result);
        else entry.reject(new Error(m.error));
      });

      // Run one of THIS plugin's own WASM exports through the host; the broker
      // still enforces the capabilities the manifest was granted.
      function invoke(fn, args) {
        const id = nextId++;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          parent.postMessage(
            { channel: CHANNEL, kind: "invoke", id, fn, args },
            "*",
          );
        });
      }

      const form = document.querySelector("#eval");
      const input = document.querySelector("#typeId");
      const out = document.querySelector("#out");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const typeId = Number(input.value);
        if (!Number.isFinite(typeId)) return;
        out.textContent = "Evaluating…";
        try {
          // The type id goes as a number: the host serialises it to the bare
          // bytes the WASM `evaluate(type_id: String)` reads.
          const r = await invoke("evaluate", typeId);
          out.innerHTML =
            `<strong>${r.name}</strong> — ${r.volume} m³ · ` +
            `score ${r.score} · evaluated ${r.evaluations}×`;
        } catch (err) {
          out.textContent =
            "Error: " + (err instanceof Error ? err.message : String(err));
        }
      });
    </script>
  </body>
</html>
