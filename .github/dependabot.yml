# Weekly dependency updates, minor/patch only, grouped into one PR per
# ecosystem. Deliberately NOT automated:
#
# - Major versions: they need a human (TypeScript/Vite/Vitest/jsdom/ESLint
#   majors, rusqlite, rand, boa_engine, and the actions' majors all change
#   behaviour). Bump them by hand in a dedicated PR. Security updates are
#   unaffected by `ignore` and still open PRs.
# - The Tauri npm packages and Rust crates: they MUST move together —
#   `tauri build` aborts on a major.minor mismatch (v0.79.0, #1200) and CI's
#   scripts/check-tauri-versions.mjs fails a PR that skews them. Dependabot
#   cannot group across ecosystems, so a lone `tauri` crate or `@tauri-apps/*`
#   bump would always fail that check. Update both sides in one manual PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
