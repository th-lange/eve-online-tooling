name: Security

# Code scanning + dependency-vulnerability audits, separate from the `CI`
# test gate: these run on the same PR/push triggers plus a weekly schedule
# (so newly-disclosed advisories surface even on an otherwise-quiet repo),
# but are informational rather than merge-blocking for now — see the
# `continue-on-error` notes below. Flip those off once the existing
# findings (tracked separately) are triaged.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # No Rust build step (webkit2gtk/gtk toolchain, SDE download, …) —
          # `none` extracts without compiling, trading a little recall for a
          # fast, dependency-free scan. Revisit if that proves too lossy.
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational for now: the current tree has known high/critical
      # advisories (postcss, react-router, tinypool, …) that need a
      # deliberate, tested dependency bump, not a silent CI-driven one.
      # `continue-on-error` keeps this from blocking merges while that's
      # pending; the step output still shows red in the run log.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every event — PR, push and the weekly schedule — gates on the
      # `cargo-audit` CLI, which reads src-tauri/.cargo/audit.toml itself, so
      # the ignore list keeps its single source and its written reason per ID.
      # A vulnerability fails the job; "unmaintained"/"unsound" notices are
      # warnings and don't.
      #
      # rustsec/audit-check used to run here and is gone for two reasons: it
      # posts findings as a *check run*, an API call that intermittently fails
      # with "Not Found" and turned clean audits red (#1288, #1291); and on a
      # schedule it opens one issue per finding including informational ones,
      # which filed 18 issues for already-documented unmaintained crates in a
      # single run (#1302-#1319). A red weekly run is the same alert without
      # either failure mode.
      - name: Install cargo-audit
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - name: Audit
        working-directory: src-tauri
        run: cargo audit
