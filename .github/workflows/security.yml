name: Security

# Code scanning + dependency-vulnerability audits, separate from the `CI`
# test gate: these run on the same PR/push triggers plus a weekly schedule
# (so newly-disclosed advisories surface even on an otherwise-quiet repo),
# but are informational rather than merge-blocking for now — see the
# `continue-on-error` notes below. Flip those off once the existing
# findings (tracked separately) are triaged.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # No Rust build step (webkit2gtk/gtk toolchain, SDE download, …) —
          # `none` extracts without compiling, trading a little recall for a
          # fast, dependency-free scan. Revisit if that proves too lossy.
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational for now: the current tree has known high/critical
      # advisories (postcss, react-router, tinypool, …) that need a
      # deliberate, tested dependency bump, not a silent CI-driven one.
      # `continue-on-error` keeps this from blocking merges while that's
      # pending; the step output still shows red in the run log.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # rustsec/audit-check reports through a check run (PRs/pushes) and an
    # issue (schedule). With the workflow-wide read-only token it failed with
    # "Resource not accessible by integration" while the job stayed green, so
    # 41 advisories were never reported (#1198).
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Gating: the lockfile is clean apart from advisories ignored, with a
      # written reason and an exit path, in src-tauri/.cargo/audit.toml.
      # "Unmaintained" notices are warnings and don't fail the job.
      # rustsec/audit-check does not read src-tauri/.cargo/audit.toml (its run
      # showed `"ignore":[]`), so pass the same IDs through its `ignore` input.
      # audit.toml stays the single source, with a written reason per ID.
      - name: Collect ignored advisories from audit.toml
        id: ignores
        run: |
          ids=$(grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' src-tauri/.cargo/audit.toml | sort -u | paste -sd, -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Ignoring: $ids"

      # PRs and pushes gate on the `cargo-audit` CLI, which reads
      # src-tauri/.cargo/audit.toml itself (one source for the ignores, each
      # with a written reason) and reports through the exit code alone.
      # rustsec/audit-check posts its findings as a *check run*, and that API
      # call intermittently fails with "Not Found" even on a clean audit,
      # turning a green audit into a red required check (seen on #1288 and
      # #1291). No check run, no flake.
      - name: Install cargo-audit
        if: github.event_name != 'schedule'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - name: Audit
        if: github.event_name != 'schedule'
        working-directory: src-tauri
        run: cargo audit

      # The weekly run keeps the action: on a schedule it files an issue for
      # newly-disclosed advisories, which the CLI can't do. A failed check-run
      # post there costs a red scheduled run, not a blocked merge.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        if: github.event_name == 'schedule'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: ${{ steps.ignores.outputs.ids }}
