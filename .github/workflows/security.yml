name: Security

# Code scanning + dependency-vulnerability audits, separate from the `CI`
# test gate: these run on the same PR/push triggers plus a weekly schedule
# (so newly-disclosed advisories surface even on an otherwise-quiet repo).
# Both audits are merge-blocking: the tree reports zero `npm audit`
# high/critical findings and zero `cargo audit` vulnerabilities, so anything
# new here is a regression rather than part of a backlog.
#
# No path filter on `pull_request`: `cargo audit` is a required status check
# on `main`, and a required check that never reports (a docs-only PR skipped
# by `paths-ignore`) would leave that PR unmergeable forever.
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # No Rust build step (webkit2gtk/gtk toolchain, SDE download, …) —
          # `none` extracts without compiling, trading a little recall for a
          # fast, dependency-free scan. Revisit if that proves too lossy.
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: the tree reports zero advisories as of #1324, so a new
      # high/critical one is a regression to look at, not noise to wave
      # through. Moderate and below stay out of the gate — they are tracked by
      # the weekly run's output, not by failing a merge.
      - name: Audit
        run: npm audit --audit-level=high

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every event — PR, push and the weekly schedule — gates on the
      # `cargo-audit` CLI, which reads src-tauri/.cargo/audit.toml itself, so
      # the ignore list keeps its single source and its written reason per ID.
      # A vulnerability fails the job; "unmaintained"/"unsound" notices are
      # warnings and don't.
      #
      # rustsec/audit-check used to run here and is gone for two reasons: it
      # posts findings as a *check run*, an API call that intermittently fails
      # with "Not Found" and turned clean audits red (#1288, #1291); and on a
      # schedule it opens one issue per finding including informational ones,
      # which filed 18 issues for already-documented unmaintained crates in a
      # single run (#1302-#1319). A red weekly run is the same alert without
      # either failure mode.
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - name: Audit
        working-directory: src-tauri
        run: cargo audit
