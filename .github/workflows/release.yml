name: Release

# Builds installers and attaches them to the GitHub Release when a v* tag is
# pushed. Can also be run manually against a tag via "Run workflow".
#
# Windows builds on every tagged release. macOS (universal) + Linux build only
# on **minor** releases (tags ending in `.0`, e.g. v0.27.0) — patch releases
# (v0.27.1, …) are Windows-only to save Actions minutes. A manual run can force
# the full matrix with the `all_platforms` input.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Build macOS + Linux too (default: only on x.y.0 releases)"
        type: boolean
        default: false

jobs:
  # Decide the build matrix from the tag: full 3-platform set on a `.0` (minor)
  # release, else Windows-only. Manual runs can force the full set.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          WIN='{"platform":"windows-latest","args":"","rust-targets":""}'
          MAC='{"platform":"macos-latest","args":"--target universal-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          LNX='{"platform":"ubuntu-22.04","args":"","rust-targets":""}'
          if [[ "${{ github.ref_name }}" == *.0 || "${{ github.event.inputs.all_platforms }}" == "true" ]]; then
            echo "Full multi-platform build (minor release or forced)."
            echo "matrix={\"include\":[$MAC,$LNX,$WIN]}" >> "$GITHUB_OUTPUT"
          else
            echo "Patch release — Windows only."
            echo "matrix={\"include\":[$WIN]}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # No code signing: see the "Why builds are unsigned" note in the notes
      # job below and in the README. Not revisiting this without a sane-cost
      # path for non-US/CA/EU/UK developers.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EVE Online Tooling ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. The builds are **unsigned** — see the README for how to open them on macOS/Windows."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Fill in the GitHub Release description once the builds are up: "what goes
  # live" (the changed) is GitHub's auto-generated changelog (merged PRs since
  # the previous tag); on top of that we explain why the installers are
  # unsigned so people aren't left guessing at the SmartScreen/Gatekeeper
  # prompt. Replaces the old fixed-text-only body that had to be hand-edited
  # after every release.
  notes:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate + set release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## What's in this release"
            echo
            gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
            echo
            echo "---"
            echo
            echo "## About the \"unknown publisher\" warnings"
            echo
            echo "These builds are **unsigned** — Windows SmartScreen and macOS Gatekeeper will both complain on first launch. Click through it:"
            echo "- **Windows**: SmartScreen → **More info** → **Run anyway**."
            echo "- **macOS**: right-click the app → **Open** (or \`xattr -dr com.apple.quarantine \"/Applications/EVE Online Tooling.app\"\`)."
            echo
            echo "### Why unsigned"
            echo
            echo "Code signing is not available to developers outside North America at a reasonable price. Microsoft's Authenticode (with enough reputation to skip SmartScreen) and Apple's notarization both gate their cert/identity requirements behind verification and fees that effectively exclude non-North-American independent developers. This is a free hobby project — it ships unsigned rather than pay a screening tollbooth that isn't offered on fair terms outside the US/Canada. Build from source if you'd rather not click through the warning."
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
