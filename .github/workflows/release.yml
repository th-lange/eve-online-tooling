name: Release

# Builds installers and attaches them to the GitHub Release when a v* tag is
# pushed. Can also be run manually against a tag via "Run workflow".
#
# Builds the full set — Windows, macOS (universal) and Linux — on every tagged
# release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Queue (don't cancel) a second run against the same tag — a manual re-run
# while the original is still in flight (e.g. recovering from a stalled
# platform leg) must not race the original publish. See #1096.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Validate build-time secrets before spending any runner minutes.
      # A release must never ship with the Feedback module silently disabled —
      # a renamed or missing secret would succeed silently and ship broken.
      # Note: this is intentionally NOT a secret: Firebase *web* API keys are
      # identifiers (extractable from any shipped build); the Firestore security
      # rules are what gate writes. They live in secrets so they can be rotated
      # without a code change. See docs/feedback.md.
      - name: Require build config secrets
        shell: bash
        env:
          EVE_TOOLING_FIREBASE_PROJECT_ID: ${{ secrets.EVE_TOOLING_FIREBASE_PROJECT_ID }}
          EVE_TOOLING_FIREBASE_API_KEY: ${{ secrets.EVE_TOOLING_FIREBASE_API_KEY }}
        run: |
          fail=0
          if [ -z "$EVE_TOOLING_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing repository secret EVE_TOOLING_FIREBASE_PROJECT_ID"
            fail=1
          fi
          if [ -z "$EVE_TOOLING_FIREBASE_API_KEY" ]; then
            echo "::error::Missing repository secret EVE_TOOLING_FIREBASE_API_KEY"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Set them under Settings -> Secrets and variables -> Actions"
            echo "(Repository secrets, not Environment secrets). See docs/feedback.md."
            echo "Without them the build would succeed but ship with feedback disabled."
            exit 1
          fi
          echo "Build config secrets present."

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --fix-missing \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Restore the release-mode dependency cache built on main by the
          # warm-release-cache workflow. Tag refs can read main's caches but a
          # cache saved HERE would be unreachable from any future tag — so
          # never save (also cuts 30–70s of pointless upload per platform).
          shared-key: "release-build"
          save-if: "false"

      - name: Install frontend dependencies
        run: npm ci

      # No code signing: see the "Why builds are unsigned" note in the notes
      # job below and in the README. Not revisiting this without a sane-cost
      # path for non-US/CA/EU/UK developers.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVE_TOOLING_FIREBASE_PROJECT_ID: ${{ secrets.EVE_TOOLING_FIREBASE_PROJECT_ID }}
          EVE_TOOLING_FIREBASE_API_KEY: ${{ secrets.EVE_TOOLING_FIREBASE_API_KEY }}
          # Sentry error reporting. Absent = Sentry disabled (graceful — unlike
          # Firebase, a missing DSN is not a build error). Both Rust and the
          # Vite frontend read the same secret under different env var names.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EVE Online Tooling ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. The builds are **unsigned** — see the README for how to open them on macOS/Windows."
          # Published as a draft here; the notes job undrafts it only once
          # every matrix leg has succeeded (needs: release), so a partial
          # release (e.g. a hung/failed Linux leg) never goes live. See #1091.
          releaseDraft: true
          # Pre-release tags (anything with a `-`, e.g. v0.75.0-beta.1) become
          # GitHub prereleases: excluded from /releases/latest, so the in-app
          # update check never offers a beta to stable users.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # WiX requires numeric-only pre-release identifiers, so beta builds
          # skip the MSI and ship the (primary) NSIS installer on Windows.
          args: ${{ matrix.args }} ${{ matrix.platform == 'windows-latest' && contains(github.ref_name, '-') && '--bundles nsis' || '' }}

  # Fill in the GitHub Release description once the builds are up: "what goes
  # live" (the changed) is GitHub's auto-generated changelog (merged PRs since
  # the previous tag); on top of that we explain why the installers are
  # unsigned so people aren't left guessing at the SmartScreen/Gatekeeper
  # prompt. Replaces the old fixed-text-only body that had to be hand-edited
  notes:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Generate + set release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## What's in this release"
            echo
            gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
            echo
            echo "---"
            echo
            echo "## About the \"unknown publisher\" warnings"
            echo
            echo "These builds are **unsigned** — Windows SmartScreen and macOS Gatekeeper will both complain on first launch. Click through it:"
            echo "- **Windows**: SmartScreen → **More info** → **Run anyway**."
            echo "- **macOS**: right-click the app → **Open** (or \`xattr -dr com.apple.quarantine \"/Applications/EVE Online Tooling.app\"\`)."
            echo
            echo "### Why unsigned"
            echo
            echo "Code signing is not available to developers outside North America at a reasonable price. Microsoft's Authenticode (with enough reputation to skip SmartScreen) and Apple's notarization both gate their cert/identity requirements behind verification and fees that effectively exclude non-North-American independent developers. This is a free hobby project — it ships unsigned rather than pay a screening tollbooth that isn't offered on fair terms outside the US/Canada. Build from source if you'd rather not click through the warning."
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md

      # Only run once every matrix leg has succeeded (needs: release above),
      # so a partial release never leaves draft state. See #1091.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
