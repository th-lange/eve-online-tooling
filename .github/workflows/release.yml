name: Release

# Builds installers and attaches them to the GitHub Release when a v* tag is
# pushed. Can also be run manually against a tag via "Run workflow".
#
# Windows builds on every tagged release. macOS (universal) + Linux build only
# on **minor** releases (tags ending in `.0`, e.g. v0.27.0) — patch releases
# (v0.27.1, …) are Windows-only to save Actions minutes. A manual run can force
# the full matrix with the `all_platforms` input.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Build macOS + Linux too (default: only on x.y.0 releases)"
        type: boolean
        default: false

jobs:
  # Decide the build matrix from the tag: full 3-platform set on a `.0` (minor)
  # release, else Windows-only. Manual runs can force the full set.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          WIN='{"platform":"windows-latest","args":"","rust-targets":""}'
          MAC='{"platform":"macos-latest","args":"--target universal-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          LNX='{"platform":"ubuntu-22.04","args":"","rust-targets":""}'
          if [[ "${{ github.ref_name }}" == *.0 || "${{ github.event.inputs.all_platforms }}" == "true" ]]; then
            echo "Full multi-platform build (minor release or forced)."
            echo "matrix={\"include\":[$MAC,$LNX,$WIN]}" >> "$GITHUB_OUTPUT"
          else
            echo "Patch release — Windows only."
            echo "matrix={\"include\":[$WIN]}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: setup
    permissions:
      contents: write
    # Surfaced from a secret so the SignPath steps below can gate on it — they
    # stay inert until the SignPath secrets/vars are configured (see SIGNING.md).
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EVE Online Tooling ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. The builds are **unsigned** — see the README for how to open them on macOS/Windows."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # --- Windows code signing via SignPath Foundation (free for OSS) --------
      # These steps are INERT until the SignPath secrets/vars are set (see
      # SIGNING.md); until then `env.SIGNPATH_API_TOKEN` is empty and each is
      # skipped, so the release is published exactly as today. Once configured,
      # they re-sign the just-built Windows installers and replace the release
      # assets with the signed versions.
      - name: Upload unsigned Windows installers (for signing)
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Submit installers to SignPath
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: eve-online-tooling
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace release assets with signed installers
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            signed/**/*-setup.exe signed/**/*.msi --clobber
