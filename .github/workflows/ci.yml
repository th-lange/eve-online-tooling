name: CI

# Test gate for pull requests (and pushes to main). The release workflow only
# runs on tags, so without this nothing verified a change before it merged —
# a PR could land with broken tests and only surface at release time.
#
# Kept Linux-only to conserve Actions minutes; the compiled crate is
# platform-independent for test purposes. Lint gates (clippy -D warnings,
# rustfmt --check) are added once the codebase is clean — see #327.
on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + format + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # `npm run build`'s prebuild step regenerates the tauri-specta TS
      # bindings for the orders module (#589), so this job also needs a Rust
      # toolchain even though it's frontend-focused.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Regenerate the tauri-specta bindings, then fail if the committed file
      # drifted from what the export produces for the current Rust source —
      # i.e. someone changed `OrderRow`/`orders_list` and forgot to re-run
      # `npm run generate:bindings` before committing. This runs here (Linux)
      # and NOT inside `npm run build`, so release builds — including the
      # Windows runner, where the cargo test binary crashes under
      # tauri-action (STATUS_ENTRYPOINT_NOT_FOUND) — just consume the
      # committed, CI-verified file.
      - name: Regenerate bindings
        run: npm run generate:bindings

      # Type-check gate (`tsc && vite build`).
      - name: Type-check + build
        run: npm run build

      - name: Check generated bindings are committed
        run: git diff --exit-code -- src/lib/api/generated

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
