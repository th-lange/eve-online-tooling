[package]
name = "eve-online-tooling"
version = "0.57.0"
description = "EVE Online tooling — production, trading and more"
authors = ["Thomas Lange"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eve_tooling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in gate for the tauri-specta TS export test (bindings.rs): only
# `npm run generate:bindings` turns it on, so a plain `cargo test` never
# rewrites the committed src/lib/api/generated/orders.ts as a side effect.
export-bindings = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Type-safe TS binding generation for Tauri commands (pilot: orders module only, #589).
# Pinned with `=` per upstream guidance — tauri-specta v2 is still pre-1.0 and each
# rc can introduce breaking changes.
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# SDE service: SQLite (statically bundled), streaming download, bz2 decompress.
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
flate2 = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time", "sync"] }
# EVE SSO (OAuth2 PKCE): keychain, hashing/encoding, loopback redirect server.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"
# Parse HTTP `Expires`/`Date` headers for ESI's caching contract.
httpdate = "1"
rand = "0.8"
tiny_http = "0.12"
semver = "1.0.28"
extism = "1.30.0"
parking_lot = "0.12.5"
rhai = { version = "1.25", features = ["sync", "serde"] }
boa_engine = "0.21"
# Plugin drag-and-drop install (folder or .zip) — extraction only.
zip = { version = "2", default-features = false, features = ["deflate"] }


[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt"] }
