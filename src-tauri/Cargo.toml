[package]
name = "eve-online-tooling"
version = "0.79.0"
description = "EVE Online tooling — production, trading and more"
authors = ["Thomas Lange"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eve_tooling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in gate for the tauri-specta TS export test (bindings.rs): only
# `npm run generate:bindings` turns it on, so a plain `cargo test` never
# rewrites the committed src/lib/api/generated/orders.ts as a side effect.
export-bindings = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Native folder picker for the sync-folder setting (#1128 follow-up).
tauri-plugin-dialog = "2"
# Type-safe TS binding generation for Tauri commands (pilot: orders module only, #589).
# Pinned with `=` per upstream guidance — tauri-specta v2 is still pre-1.0 and each
# rc can introduce breaking changes.
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Overview export parsing (#869) — already resolved transitively (tauri-cli's
# wasm tooling), pinned directly here since dpsmeter/overview.rs depends on it.
serde_yaml = "0.9"
thiserror = "1"
# SDE service: SQLite (statically bundled), streaming download, bz2 decompress.
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
flate2 = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time", "sync"] }
# Live zKillboard killstream websocket (#924) — rustls to match reqwest's TLS
# backend above, so no openssl enters the dependency tree.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# EVE SSO (OAuth2 PKCE): keychain, hashing/encoding, loopback redirect server.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"
# Parse HTTP `Expires`/`Date` headers for ESI's caching contract.
httpdate = "1"
rand = "0.8"
tiny_http = "0.12"
semver = "1.0.28"
extism = "1.30.0"
parking_lot = "0.12.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
rhai = { version = "1.25", features = ["sync", "serde"] }
boa_engine = "0.21"
# Plugin drag-and-drop install (folder or .zip) — extraction only.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Error reporting: captures panics and WARN/ERROR records in release builds.
# DSN baked in via SENTRY_DSN env var at build time (absent = disabled).
# rustls matches the rest of the project; avoids pulling in native-tls.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native WebKitCache clearing (#1114) — same libwebkit2gtk already linked
# transitively by tauri/wry; pinned to the exact version/features tauri's
# dependency tree already resolves to, so this doesn't pull in a second copy.
webkit2gtk = { version = "2.0.2", features = ["v2_16"] }

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# Shipped binaries carry full debug symbols by default (cargo's release
# profile only sets opt-level = 3; strip defaults to "none"). Stripping cuts
# tens of percent off every bundle format without changing codegen or
# behavior — Sentry (above) doesn't need local debug symbols present in the
# binary users download. See #1094.
[profile.release]
strip = true
